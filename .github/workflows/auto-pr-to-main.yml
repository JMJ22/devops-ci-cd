# .github/workflows/auto-pr-to-main.yml
name: Create PR to Main

on:
  pull_request:
    branches: [develop]
    types: [closed]

jobs:
  create-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request to Main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          base: develop
          title: "Promote to Production: ${{ github.event.pull_request.title }}"
          body: |
            This PR was automatically created after merging to develop.
            
            Changes:
            - ${{ github.event.pull_request.title }}
            
            Deployments will run automatically after merge.
          labels: automated-pr,production
