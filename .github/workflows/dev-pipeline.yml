# .github/workflows/dev-pipeline.yml
name: Development Pipeline

on:
  pull_request:
    branches: [develop]
    types: [closed]  # Só roda quando PR é fechado (merged ou não)

jobs:
  check-merged:
    if: github.event.pull_request.merged == true  # Só se foi MERGE, não se foi fechado sem merge
    runs-on: ubuntu-latest
    outputs:
      is-merged: ${{ github.event.pull_request.merged }}
    
    steps:
      - name: Check if PR was merged
        run: |
          echo "PR foi mergeado: ${{ github.event.pull_request.merged }}"

  # SÓ RODA SE O PR FOI MERGEADO
  smoke-tests:
    needs: check-merged
    if: needs.check-merged.outputs.is-merged == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}  # Checkout do código mergeado
      
      - name: Run Smoke Tests
        run: |
          echo "🧪 Executando testes de fumaça..."
          # Seus comandos reais aqui

  unit-tests:
    needs: smoke-tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: Run Unit Tests
        run: |
          echo "⚡ Executando testes unitários..."
          # Seus comandos reais aqui

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: Build Application
        run: |
          echo "🔨 Building application..."
          mkdir -p dist
          echo "build-${{ github.sha }}" > dist/version.txt
      
      - name: Set artifact name
        id: set-artifact
        run: |
          echo "name=build-${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: ./dist/

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
      
      - name: Deploy to Development
        run: |
          echo "🚀 Deploying to DEV environment..."
          echo "Build: build-${{ github.sha }}"
          # Comandos reais de deploy para DEV
        env:
          TARGET_ENV: "development"

  # JOB PARA CRIAR PR AUTOMÁTICO PARA MAIN - CORRIGIDO
  create-pr-to-main:
    needs: deploy-dev
    if: success()  # Só cria PR se todo o pipeline passou
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Create Pull Request to Main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          base: develop
          title: "🚀 Promote to Production: ${{ github.event.pull_request.title }}"
          body: |
            ## Automated Promotion to Production
            
            This pull request was automatically created after successful deployment to **DEV environment**.
            
            ### Details:
            - **Source PR**: #${{ github.event.pull_request.number }}
            - **Commit**: ${{ github.event.pull_request.merge_commit_sha }}
            - **Deployed to DEV**: ✅ Success
            - **Timestamp**: ${{ github.event.pull_request.merged_at }}
            
            ### Next Steps:
            1. Review the changes
            2. Merge this PR to deploy to QAA and PROD environments
            3. Production pipeline will run automatically after merge
            
            ---
            *Automatically generated by CI/CD Pipeline*
          labels: automated-pr,production,promotion
          assignees: ""  # Pode adicionar assignees específicos
          reviewers: ""   # Pode adicionar reviewers específicos
          draft: false
          delete-branch: false
          commit-message: "chore: promote to production [skip ci]"