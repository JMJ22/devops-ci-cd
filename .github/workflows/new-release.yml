name: New Release Pipeline

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # --- FASE 1: Testes (comum a todos) ---
  01-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Smoke Tests
        run: |
          echo "Executando testes de fumaça..."
          # Seus comandos aqui

  02-unit-tests:
    needs: 01-smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Unit Tests
        run: |
          echo "Executando testes unitários..."
          # Seus comandos aqui

  # --- FASE 2: Build (após testes) ---
  03-build:
    needs: 02-unit-tests
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-output.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Application
        run: |
          echo "Building application..."
          mkdir -p dist
          echo "build-${{ github.sha }}" > dist/version.txt
      
      - name: Set artifact name
        id: set-output
        run: |
          echo "artifact-name=build-${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: ./dist/

  # --- FASE 3: DEPLOYS PARALELOS ---
  # DEV vai rodar apenas na branch develop
  04-deploy-dev:
    needs: 03-build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.03-build.outputs.artifact-name }}
      
      - name: Deploy to Development
        run: |
          echo "🚀 Deploying to DEV (branch develop)..."
          echo "Artefato: build-${{ github.sha }}"
        env:
          TARGET_ENV: "development"

  # QAA vai rodar apenas na branch main (em paralelo com PRD)
  05-deploy-qaa:
    needs: 03-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qaa
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.03-build.outputs.artifact-name }}
      
      - name: Deploy to QAA
        run: |
          echo "🧪 Deploying to QAA (branch main)..."
          echo "Artefato: build-${{ github.sha }}"
        env:
          TARGET_ENV: "qaa"

  # PRD vai rodar apenas na branch main (em paralelo com QAA)
  06-deploy-prd:
    needs: 03-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prd
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.03-build.outputs.artifact-name }}
      
      - name: Deploy to Production
        run: |
          echo "🎯 Deploying to PRD (branch main)..."
          echo "Artefato: build-${{ github.sha }}"
        env:
          TARGET_ENV: "production"
