name: Production Pipeline

on:
  push:
    branches: [main]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Smoke Tests
        run: echo "🧪 Produção: Testes de fumaça..."

  unit-tests:
    needs: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Unit Tests
        run: echo "⚡ Produção: Testes unitários..."

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Production
        run: |
          echo "🔨 Produção: Building..."
          mkdir -p dist
          echo "prod-build-${{ github.sha }}" > dist/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prod-build-${{ github.sha }}
          path: ./dist/

  deploy-qaa:
    needs: build
    runs-on: ubuntu-latest
    environment: qaa
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-build-${{ github.sha }}
      - name: Deploy to QAA
        run: echo "🧪 Deploying to QAA..."

  deploy-prd:
    needs: build
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-build-${{ github.sha }}
      - name: Deploy to Production
        run: echo "🎯 Deploying to PRODUCTION..."
