# .github/workflows/production-pipeline.yml
name: Production Pipeline

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  check-merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      is-merged: ${{ github.event.pull_request.merged }}
    
    steps:
      - name: Check PR source branch
        run: |
          echo "PR from: ${{ github.event.pull_request.head.ref }} to: ${{ github.event.pull_request.base.ref }}"
          # Verifica se veio da develop
          if [ "${{ github.event.pull_request.head.ref }}" != "develop" ]; then
            echo "ERROR: PR must come from develop branch!"
            exit 1
          fi

  smoke-tests:
    needs: check-merged
    if: needs.check-merged.outputs.is-merged == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: Run Smoke Tests
        run: |
          echo "🧪 Executando testes de fumaça (produção)..."
          # Mesmos testes ou mais rigorosos

  unit-tests:
    needs: smoke-tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: Run Unit Tests
        run: |
          echo "⚡ Executando testes unitários (produção)..."
          # Testes de produção

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      
      - name: Build Production Application
        run: |
          echo "🔨 Building PRODUCTION application..."
          mkdir -p dist
          echo "prod-build-${{ github.sha }}" > dist/version.txt
      
      - name: Set artifact name
        id: set-artifact
        run: |
          echo "name=prod-build-${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-build-${{ github.sha }}
          path: ./dist/

  # DEPLOYS PARALELOS
  deploy-qaa:
    needs: build
    runs-on: ubuntu-latest
    environment: qaa
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-build-${{ github.sha }}
      
      - name: Deploy to QAA
        run: |
          echo "🧪 Deploying to QAA environment..."
          echo "Build: prod-build-${{ github.sha }}"
          # Comandos reais para QAA
        env:
          TARGET_ENV: "qaa"

  deploy-prd:
    needs: build
    runs-on: ubuntu-latest
    environment: prd
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-build-${{ github.sha }}
      
      - name: Deploy to Production
        run: |
          echo "🎯 Deploying to PRODUCTION environment..."
          echo "Build: prod-build-${{ github.sha }}"
          # Comandos reais para produção
        env:
          TARGET_ENV: "production"
